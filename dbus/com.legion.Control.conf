<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Legion Control system bus policy.

  Only root (the daemon, started by systemd) may own com.legion.Control.
  Everyone may call it: every method that changes hardware is authorised
  individually with polkit by the daemon (see com.legion.Control.policy).
  Install to /usr/share/dbus-1/system.d/.
-->
<busconfig>
  <policy user="root">
    <allow own="com.legion.Control"/>
  </policy>

  <policy context="default">
    <allow send_destination="com.legion.Control"
           send_interface="com.legion.Control.Manager"/>
    <allow send_destination="com.legion.Control"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="com.legion.Control"
           send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="com.legion.Control"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="com.legion.Control"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
  </policy>
</busconfig>
